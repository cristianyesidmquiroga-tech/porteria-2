{% extends 'base.html' %}

{% block content %}
<div class="glass-card animate-on-scroll" style="max-width: 640px; margin: 4rem auto; padding: 3rem 2rem; text-align: center; border-radius: 18px;">
    <i class="fas fa-triangle-exclamation" style="font-size: 3.5rem; color: #e74c3c;" aria-hidden="true"></i>
    <h1 style="margin: 1.5rem 0 0.5rem 0; font-size: 1.6rem;">Ocurrió un error interno</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">
        El equipo técnico ya fue notificado. Intenta de nuevo en unos minutos.
    </p>
    <a href="{{ url_for('main.index') }}" class="glass-btn">
        <i class="fas fa-home" aria-hidden="true"></i> Volver al inicio
    </a>
</div>
{% endblock %}
