<header class="top-header">
    <div class="header-container">
        <div id="menu-toggle" class="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>
        <div class="logo-header-group" style="min-width: 0; overflow: hidden;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA Logo" class="header-logo">
            <h1 class="page-title highlight-rainbow text-3d" style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{% block title %}Panel General{% endblock %}</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; margin-left: auto; flex-shrink: 0;">
            <button class="theme-switch theme-icon-btn" aria-label="Cambiar Tema" title="Cambiar Tema">
                <i class="fas fa-moon"></i>
            </button>
            <a href="{{ url_for('usuarios.profile') }}" class="user-pill user-pill--enlace" style="margin: 0; cursor: pointer; transition: transform 0.2s; text-decoration: none; color: inherit; display: flex; align-items: center;">
                <img src="{{ current_user.url_foto }}"
                     alt="Tu foto de perfil" class="nav-user-photo" decoding="async"
                     width="38" height="38"
                     data-respaldo="{{ url_for('static', filename=current_user.avatar_cargo) }}">
                <span>{{ current_user.nombre }}</span>
            </a>
            {# "Cerrar sesión" vive ahora en el menú lateral: aquí se salía de
               la barra en pantallas estrechas, porque el título compite por el
               mismo espacio. #}
        </div>
    </div>
</header>
