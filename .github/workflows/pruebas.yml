name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: porteria
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: porteria_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U porteria -d porteria_pruebas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: clave-solo-para-pruebas-0123456789abcdef
      DATABASE_URL: postgresql://porteria:pruebas@localhost:5432/porteria_pruebas
      COOKIES_SEGURAS: "false"
      EJECUTAR_TAREAS: "false"
      PYTHONPATH: .

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest tests -v --maxfail=1
