services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: carnet_sena_web
    restart: always
    expose:
      - 5000
    volumes:
      # Fotos de perfil. Fuera de static/ a proposito: alli Flask las servia a
      # cualquiera sin sesion. Este volumen NO es opcional: sin el, las fotos
      # viven en el disco efimero del contenedor y el siguiente redespliegue
      # las borra todas, sin copia posible (el respaldo mensual no las incluye).
      - ../datos/fotos_perfil:/app/datos/fotos_perfil
      # Carpeta antigua: se conserva montada para que las fotos que quedaron
      # dentro se puedan trasladar en el primer arranque.
      - ../app/static/uploads:/app/app/static/uploads
      # Respaldos mensuales: el proceso de respaldo BORRA los datos de la base
      # despues de exportarlos, asi que este volumen no es opcional.
      - ../app/respaldos_mensuales:/app/app/respaldos_mensuales
    env_file:
      - ../config/.env
    environment:
      - TZ=America/Bogota
      - CARPETA_FOTOS=/app/datos/fotos_perfil
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/salud"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify

networks:
  coolify:
    external: true
