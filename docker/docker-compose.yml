services:
  # La base de datos vive fuera de este despliegue. Se conecta mediante
  # DATABASE_URL; este Compose solo construye y ejecuta la aplicación web.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: carnet_sena_web
    restart: always
    expose:
      - 5000
    volumes:
      - datos/fotos_perfil:/app/datos/fotos_perfil
      - app/static/uploads:/app/app/static/uploads
      - app/respaldos_mensuales:/app/app/respaldos_mensuales
    environment:
      - TZ=America/Bogota
      - CARPETA_FOTOS=/app/datos/fotos_perfil
      - SECRET_KEY
      - DATABASE_URL
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - ADMIN_DOCUMENTO
      - MAIL_SERVER
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_DEFAULT_SENDER
      - MAIL_NOMBRE_REMITENTE
      - MAIL_CIFRADO
      - MAIL_MODO
      - MAIL_RESPALDO_RELE
      - MAIL_PAUSA_SEGUNDOS
      - DOMINIOS_REGISTRO
      - COOKIES_SEGURAS
      - PROXIES_CONFIABLES
      - RATELIMIT_STORAGE_URI
      - LIMITE_PETICIONES
      - LIMITE_GENERAL
      - CAPTCHA_ACTIVO
      - CAPTCHA_DIFICULTAD
      - EJECUTAR_TAREAS
      - ZONA_HORARIA
      - GUNICORN_THREADS
      - CARNET_ENTIDAD
      - CARNET_ENTIDAD_LARGA
      - CARNET_REGIONAL
      - CARNET_CENTRO
      - CARNET_MUNICIPIO
      - CARNET_ASEGURADORA
      - CARNET_ASEGURADORA_TEL
      - CARNET_POLIZA
      - CARNET_PERFILES
      - RECARGAR_PLANTILLAS
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/salud"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify

networks:
  coolify:
    external: true
